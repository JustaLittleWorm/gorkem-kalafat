    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* SVG Grain / Noise Overlay */
    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
      opacity: 0.82;
      mix-blend-mode: overlay;
    }

    .main-container {
      position: relative;
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      container-type: inline-size;
    }

    /* Sol isim ve unvan alanı */
    .brand-section {
      position: absolute;
      left: 10.1%;
      top: 12.5cqw;
      z-index: 20;
    }

    .name-title {
      font-family: 'Palma W00 Regular', 'Caveat', cursive, sans-serif;
      font-size: 3.2rem;
      color: #e53935;
      letter-spacing: 1px;
      line-height: 1.1;
      font-weight: normal;
    }

    .subtitle {
      font-family: 'Helvetica Neue', Helvetica, 'Helvetica Light', Arial, sans-serif;
      font-weight: 300;
      font-style: italic;
      font-size: 0.95rem;
      color: #a0a0a0;
      margin-top: 2px;
      letter-spacing: 0.5px;
      text-align: right;
    }

    /* 26 Adet Görsel İçin Dağınık Alan */
    .gallery-container {
      position: relative;
      width: 100%;
      height: 293cqw;
      margin: 0 auto;
      container-type: inline-size;
    }

    .photo-card {
      position: absolute;
      background-color: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.4s ease;
    }

    .photo-card:hover,
    .photo-card:focus-within {
      z-index: 100 !important;
      transform: scale(1.03);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--object-position, 50% 50%);
      display: block;
    }

    .photo-card a {
      display: block;
      width: 100%;
      height: 100%;
    }

    .photo-card a:focus-visible,
    .social-icon:focus-visible,
    .contact-footer a:focus-visible {
      outline: 2px solid #e53935;
      outline-offset: 4px;
    }

    .video-player {
      position: fixed;
      top: 50%;
      left: 50vw;
      width: min(1000px, calc(100vw - 32px), calc((100vh - 32px) * 16 / 9));
      height: auto;
      margin: 0;
      transform: translate(-50%, -50%);
      aspect-ratio: 16 / 9;
      max-width: none;
      max-height: none;
      padding: 0;
      border: 0;
      overflow: visible;
      background: transparent;
    }

    .video-player::backdrop {
      background: transparent;
    }

    .player-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .contact-footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 36px 0 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      color: #a0a0a0;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .contact-details {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      grid-column: 3;
      text-align: right;
    }

    .contact-separator {
      white-space: pre;
    }

    .contact-footer .social-icon {
      grid-column: 2;
      grid-row: 1;
    }

    .contact-footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .contact-footer a:hover {
      color: #fff;
    }

  <script>
    const videoPlayer = document.querySelector('.video-player');
    const playerFrame = document.querySelector('.player-frame');

    document.querySelectorAll('.photo-card a[href^="https://vimeo.com/"]').forEach((link) => {
      link.addEventListener('click', (event) => {
        const videoId = new URL(link.href).pathname.split('/').filter(Boolean)[0];
        if (!/^\d+$/.test(videoId)) {
          return;
        }

        event.preventDefault();
        playerFrame.src = `https://player.vimeo.com/video/${videoId}?autoplay=1`;
        videoPlayer.showModal();
      });
    });

    function closeVideoPlayer() {
      videoPlayer.close();
      playerFrame.src = '';
    }

    videoPlayer.addEventListener('click', (event) => {
      if (event.target === videoPlayer) {
        closeVideoPlayer();
      }
    });
    videoPlayer.addEventListener('close', () => {
      playerFrame.src = '';
    });
  </script>
