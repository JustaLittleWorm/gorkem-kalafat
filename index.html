  <style>
    
    /* 1. Palma W00 Regular font tanımı */
    @font-face {
      font-family: 'Palma W00 Regular';
      /* Kendi klasör yapına göre göreceli (relative) yol */
      src: url('assets/font/Palma-W00-Regular.woff2') format('woff2'),
           url('assets/font/Palma-W00-Regular.ttf') format('truetype'),
           url('assets/font/Palma-W00-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    .subtitle {
  font-family: "Helvetica Light", "Helvetica Neue Light", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: 300;      /* Light */
  font-style: italic;     /* Italic */
  font-size: 0.95rem;
  color: #a0a0a0;
  margin-top: 8px;
  letter-spacing: 0.5px;
}

    /* Google Font Fallback (Yüklenememe durumuna karşı sanatsal alternatif) */
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* SVG Grain / Noise Overlay */
    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
      opacity: 0.82;
      mix-blend-mode: overlay;
    }

    .main-container {
      position: relative;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 40px;
    }

    /* Sol isim ve unvan alanı */
    .brand-section {
      position: absolute;
      left: 6%;
      top: 180px;
      z-index: 10;
    }

    .name-title {
      font-family: 'Palma W00 Regular', 'Caveat', cursive, sans-serif;
      font-size: 3.2rem;
      color: #e53935;
      letter-spacing: 1px;
      line-height: 1.1;
      font-weight: normal;
    }

    .subtitle {
      font-family: 'Helvetica Neue', Helvetica, 'Helvetica Light', Arial, sans-serif;
      font-weight: 300;
      font-style: italic;
      font-size: 0.95rem;
      color: #a0a0a0;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    /* 26 Adet Görsel İçin Dağınık Alan */
    .gallery-container {
      position: relative;
      width: 100%;
      height: 2800px; /* Görsel sayısı arttığı için dikey alan genişletildi */
      margin-top: 40px;
    }

    .photo-card {
      position: absolute;
      background-color: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.4s ease, z-index 0.2s;
    }

    .photo-card:hover {
      z-index: 100 !important;
      transform: scale(1.03);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .social-icon {
      position: fixed;
      bottom: 30px;
      left: 40px;
      z-index: 100;
      color: #ffffff;
      opacity: 0.8;
      transition: opacity 0.3s;
    }

    .social-icon:hover {
      opacity: 1;
    }

    .social-icon svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* Mobil uyumluluk */
    @media (max-width: 900px) {
      .main-container {
        padding: 20px;
      }

      .brand-section {
        position: relative;
        top: 20px;
        left: 0;
        margin-bottom: 40px;
        text-align: center;
      }

      .name-title {
        font-size: 2.5rem;
      }

      .gallery-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        height: auto;
      }

      .photo-card {
        position: relative;
        top: auto !important;
        left: auto !important;
        width: 100% !important;
        height: 250px !important;
      }

      .social-icon {
        bottom: 20px;
        left: 20px;
      }
    }
