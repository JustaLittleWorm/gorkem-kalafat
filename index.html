  <style>
    
    /* 1. Palma W00 Regular font tanımı */
    @font-face {
      font-family: 'Palma W00 Regular';
      /* Kendi klasör yapına göre göreceli (relative) yol */
      src: url('assets/font/Palma-W00-Regular.woff2') format('woff2'),
           url('assets/font/Palma-W00-Regular.ttf') format('truetype'),
           url('assets/font/Palma-W00-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    /* Google Font Fallback (Yüklenememe durumuna karşı sanatsal alternatif) */
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* SVG Grain / Noise Overlay */
    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
      opacity: 0.82;
      mix-blend-mode: overlay;
    }

    .main-container {
      position: relative;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 40px;
    }

    /* Sol isim ve unvan alanı */
    .brand-section {
      position: absolute;
      left: 6%;
      top: 180px;
      z-index: 10;
    }

    .name-title {
      font-family: 'Palma W00 Regular', 'Caveat', cursive, sans-serif;
      font-size: 3.2rem;
      color: #e53935;
      letter-spacing: 1px;
      line-height: 1.1;
      font-weight: normal;
    }

    .subtitle {
      font-family: 'Helvetica Neue', Helvetica, 'Helvetica Light', Arial, sans-serif;
      font-weight: 300;
      font-style: italic;
      font-size: 0.95rem;
      color: #a0a0a0;
      margin-top: 2px;
      letter-spacing: 0.5px;
      text-align: right;
    }

    /* 26 Adet Görsel İçin Dağınık Alan */
    .gallery-container {
      position: relative;
      width: 100%;
      height: 3100px;
      margin-top: 40px;
    }

    .photo-card {
      position: absolute;
      --card-ratio: 16 / 10;
      background-color: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.4s ease, z-index 0.2s;
    }

    .photo-card:hover {
      z-index: 100 !important;
      transform: scale(1.03);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-card a {
      display: block;
      width: 100%;
      height: 100%;
    }

    .photo-card a:focus-visible,
    .social-icon:focus-visible,
    .contact-footer a:focus-visible {
      outline: 2px solid #e53935;
      outline-offset: 4px;
    }

    .video-player {
      position: fixed;
      top: 50%;
      left: 50vw;
      width: min(1000px, calc(100vw - 32px), calc((100vh - 32px) * 16 / 9));
      height: auto;
      margin: 0;
      transform: translate(-50%, -50%);
      aspect-ratio: 16 / 9;
      max-width: none;
      max-height: none;
      padding: 0;
      border: 0;
      overflow: visible;
      background: transparent;
    }

    .video-player::backdrop {
      background: transparent;
    }

    .player-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .contact-footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 36px 0 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      color: #a0a0a0;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .contact-details {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      grid-column: 3;
      text-align: right;
    }

    .contact-separator {
      white-space: pre;
    }

    .contact-footer .social-icon {
      grid-column: 2;
      grid-row: 1;
    }

    .contact-footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .contact-footer a:hover {
      color: #fff;
    }

    .framing-landscape,
    .framing-strip,
    .framing-portrait,
    .framing-square {
      height: auto;
      aspect-ratio: var(--card-ratio);
    }

    .framing-landscape {

    }

    .framing-strip {
      --card-ratio: 2.4 / 1;
    }

    .framing-portrait {

    .framing-square {
      --card-ratio: 1 / 1;
    }

    .framing-square img {
      object-position: center bottom;
    }

    .framing-gauge img {
      object-position: center 45%;
    }

    /* Instagram bağlantısı */
    .social-icon {
      display: inline-flex;
      color: #ffffff;
      opacity: 0.8;
      transition: opacity 0.3s;
    }

    .social-icon:hover {

    }

    .social-icon svg {
      width: 24px;
      height: 24px;

    }

    /* Mobil uyumluluk */

      }

        flex-direction: column;

        height: auto;
      }

      .photo-card {

        top: auto !important;
        left: auto !important;
        width: 100% !important;
        height: auto !important;

        grid-row: 1;
      }

      .contact-details {
        grid-column: 1;
        justify-content: flex-end;
        max-width: 100%;
      }
    }

  <script>
    const videoPlayer = document.querySelector('.video-player');
    const playerFrame = document.querySelector('.player-frame');

    document.querySelectorAll('.photo-card a[href^="https://vimeo.com/"]').forEach((link) => {
      link.addEventListener('click', (event) => {
        const videoId = new URL(link.href).pathname.split('/').filter(Boolean)[0];
        if (!/^\d+$/.test(videoId)) {
          return;
        }

        event.preventDefault();
        playerFrame.src = `https://player.vimeo.com/video/${videoId}?autoplay=1`;
        videoPlayer.showModal();
      });
    });

    function closeVideoPlayer() {
      videoPlayer.close();
      playerFrame.src = '';
    }

    videoPlayer.addEventListener('click', (event) => {
      if (event.target === videoPlayer) {
        closeVideoPlayer();
      }
    });
    videoPlayer.addEventListener('close', () => {
      playerFrame.src = '';
    });
  </script>
