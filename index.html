    function getSyllableSplitIndex(word) {
      const vowelIndexes = [...word.matchAll(/[aeıioöuü]/g)].map(({ index }) => index);
      const boundaries = [];

      for (let index = 0; index < vowelIndexes.length - 1; index += 1) {
        const currentVowel = vowelIndexes[index];
        const nextVowel = vowelIndexes[index + 1];
        const consonantsBetween = nextVowel - currentVowel - 1;
        const boundary = consonantsBetween < 2 ? currentVowel + 1 : nextVowel - 1;

        if (boundary > 0 && boundary < word.length) {
          boundaries.push(boundary);
        }
      }

      return boundaries.reduce((best, boundary) => {
        const midpoint = word.length / 2;
        return Math.abs(boundary - midpoint) <= Math.abs(best - midpoint) ? boundary : best;
      }, 0);
    }

      slash.textContent = '/';
      title.append(slash);

      if (words.length === 1) {
        const word = words[0];
        const splitIndex = getSyllableSplitIndex(word);

        if (splitIndex > 0) {
          const lightPart = document.createElement('span');
          const boldPart = document.createElement('strong');
          lightPart.className = 'photo-title-light';
          boldPart.className = 'photo-title-syllable-bold';
          lightPart.textContent = word.slice(0, splitIndex);
          boldPart.textContent = word.slice(splitIndex);
          title.append(lightPart, boldPart);
        } else {
          title.append(document.createTextNode(word));
        }
      } else {
        words.forEach((word, index) => {
          const isLastWord = index === words.length - 1;
          const part = document.createElement(isLastWord ? 'strong' : 'span');
          if (!isLastWord) {
            part.className = 'photo-title-light';
          }
          part.textContent = word;
          title.append(part);
        });
      }

      title.style.fontSize = `clamp(0.585rem, ${153 / title.textContent.length}cqi, 3.6rem)`;
      image.parentElement.append(title);
    });

    document.querySelectorAll('.photo-card a[href^="https://vimeo.com/"]').forEach((link) => {
      link.addEventListener('click', (event) => {
        const videoId = new URL(link.href).pathname.split('/').filter(Boolean)[0];
        if (!/^\d+$/.test(videoId)) {
          return;
        }

        event.preventDefault();
        playerFrame.src = `https://player.vimeo.com/video/${videoId}?autoplay=1`;
        videoPlayer.showModal();
      });
    });

    function closeVideoPlayer() {
      videoPlayer.close();
      playerFrame.src = '';
    }

    videoPlayer.addEventListener('click', (event) => {
      if (event.target === videoPlayer) {
        closeVideoPlayer();
      }
    });
    videoPlayer.addEventListener('close', () => {
      playerFrame.src = '';
    });
  </script>
</body>
</html>
